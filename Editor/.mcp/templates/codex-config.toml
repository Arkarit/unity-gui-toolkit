# Codex configuration for this repository. Project-scoped: `codex mcp list` only reports the
# server below when Codex runs with this repo as its working root, which is why the wrapper in
# tools/invoke-codex.ps1 always passes -C.
#
# Generated by the GUI Toolkit agent-tools installer (Editor/.mcp/install.mjs); the paths below were
# resolved for this machine at install time. Re-running the installer will NOT overwrite this file --
# it writes config.toml.new beside it instead, so a hand-tuned allow list is never lost.

[mcp_servers.ui-toolkit]
command = "node"
args = [
    "{{SERVER_PATH}}",
    "--project",
    "{{UNITY_PROJECT}}"
]

# An ALLOW list, not a deny list. The ui-toolkit MCP has 29 tools and keeps growing; naming the
# dangerous ones would leave whatever is added next wide open. Every tool below only reads.
#
# Deliberately absent: execute_code (compiles and runs arbitrary C# inside the running editor,
# with editor rights, outside any sandbox -- so `-s workspace-write` would be decorative next to
# it), and every writer: bake_screen, write_skin, clone_style_config, apply_prefab_values,
# capture_prefab_values, resolve_packages, recompile, play_mode, regenerate_catalog,
# mirror_variant_graph, tag_standard_element, untag_standard_element, set_ui_comment.
#
# bake_screen is not a hypothetical: it destroyed hand-made content in MainMenu.prefab on
# 2026-08-12 (finding L-20), by rebuilding a prefab from a description that no longer described it.
enabled_tools = [
    "ping",
    "status",
    "setup_status",
    "list_projects",
    "asset_state",
    "get_catalog",
    "list_styles",
    "read_skin",
    "read_screen",
    "get_console",
    # Lets Codex SEE what it made, in context, which is the point of connecting a graphics agent to
    # the editor at all. Non-destructive: it renders the prefab in a throw-away preview scene and
    # returns a PNG; the user's open scenes are neither touched nor captured.
    "screenshot_view",
]

# Belt and braces: anything not explicitly set to "approve" below asks first -- and in
# `codex exec` there is nobody to ask, so it does not run. Valid values are auto, prompt,
# writes, approve; there is no "deny", which is why the allow list above does the real work.
default_tools_approval_mode = "prompt"

# The per-tool approvals must match enabled_tools exactly, or a tool would be offered and then
# block on an approval nobody can give.
[mcp_servers.ui-toolkit.tools.ping]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.status]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.setup_status]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.list_projects]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.asset_state]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.get_catalog]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.list_styles]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.read_skin]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.read_screen]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.get_console]
approval_mode = "approve"

[mcp_servers.ui-toolkit.tools.screenshot_view]
approval_mode = "approve"
